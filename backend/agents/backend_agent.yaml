name: backend-agent
role: backend-development
description: |
  Backend Agent responsible for implementing and maintaining the Campus Placement AI backend components.
  Responsibilities include implementing FastAPI endpoints, input validation, error handling, integrations with Microsoft Foundry,
  writing tests, CI configuration, and handing off completed work to the Bug/Issue Agent for verification.
permissions:
  github: read
  foundry: read
scopes:
  - issues:read
  - issues:comment
notes: |
  This metadata file documents the intended identity and scope for the agent. Actual provisioning and secrets are managed outside this repository.
