[tool.poetry]
name = "campus-placement-backend"
version = "0.1.0"
description = "Resume Analysis Backend Agent for Campus Placement AI project"
authors = ["Campus Placement AI <dev@campus.example>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.95.2"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
